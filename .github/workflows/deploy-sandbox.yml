name: Deploy Sandbox (testes)

# Só roda no repositório de testes (Kazenski/siteKazenski-test).
# Publica a branch que deu o push na raiz do Pages do sandbox,
# para não interferir na produção (siteKazenski-2026).
on:
  push:
    # qualquer branch, exceto a main (que guarda a cópia da produção)
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sandbox-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Kazenski/siteKazenski-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Firebase config from secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          python3 - <<'PY'
          import os, pathlib

          keys = [
              "API_KEY", "AUTH_DOMAIN", "PROJECT_ID",
              "STORAGE_BUCKET", "MESSAGING_SENDER_ID", "APP_ID",
          ]
          path = pathlib.Path("js/core/firebase.js")
          if not path.exists():
              print(f"ERRO: {path} nao encontrado")
              raise SystemExit(1)
          text = path.read_text(encoding="utf-8")
          for key in keys:
              token = f"__VITE_FIREBASE_{key}__"
              value = os.environ.get(f"VITE_FIREBASE_{key}", "")
              if token in text and not value:
                  print(f"ERRO: secret VITE_FIREBASE_{key} vazio")
                  raise SystemExit(1)
              text = text.replace(token, value)
          path.write_text(text, encoding="utf-8")
          print("OK: config injetada")
          PY

      - name: Validar
        run: |
          set -euo pipefail
          test -f index.html || { echo "ERRO: index.html ausente"; exit 1; }
          if grep -rq "__VITE_FIREBASE_" .; then
            echo "ERRO: placeholders de secrets ainda presentes"
            exit 1
          fi
          echo "Artifact OK"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.repository == 'Kazenski/siteKazenski-test'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
